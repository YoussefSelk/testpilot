version: 1
defaults:
  timeout: 300
  parallel: 2
  report_dir: reports
profiles:
  local:
    env: {APP_ENV: local}
  development:
    env: {APP_ENV: development}
  staging:
    env: {APP_ENV: staging}
  ci:
    env: {APP_ENV: test}
    parallel: 4
    timeout: 600
repositories:
  - name: backend
    path: examples/repo_a
    command: [python, -m, pytest, tests/, -q, --junitxml=test-results.xml]
    junit: test-results.xml
  - name: frontend
    path: examples/repo_b
    command: [python, -m, pytest, tests/, -q, --junitxml=test-results.xml]
    junit: test-results.xml
