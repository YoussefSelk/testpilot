image: python:3.11-slim
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
cache:
  key:
    files: [pyproject.toml]
  paths: [.cache/pip/]
stages: [test]
testpilot:
  stage: test
  script:
    - python -m pip install -e ".[dev]"
    - python scripts/check.py
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/]
    reports:
      junit:
        - reports/unit-tests.xml
        - reports/*/junit.xml
